  /* ---------- tokens ---------- */
  :root, [data-theme="light"]{
    --green:#5DA44C; --green-2:#83B853; --green-soft:#EAF4E6; --green-ink:#3F7A32;
    --orange:#FE8526; --orange-2:#FFA25C; --orange-soft:#FFEEDF; --orange-ink:#B85A12;
    --purple:#7b6ef6; --purple-soft:#ece9ff;
    --teal:#0f9d8f; --teal-soft:#dcf3f0;
    --amber:#f0a72c; --amber-soft:#fdf0d9;
    --page:#e9f5ec; --app:#f5fbf6; --card:#ffffff; --card-2:#f4f8f5;
    --ink:#2F3941; --ink-2:#5E6B73; --line:#e3ece6;
    --on-brand:#2F3941; /* texto e iconos sobre fondos verde o naranja: nunca blanco */
    --shadow-s:0 2px 8px rgba(16,48,32,.06);
    --shadow-m:0 10px 28px rgba(16,48,32,.10);
    --shadow-l:0 -6px 24px rgba(16,48,32,.08);
    --font-display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:32px; --r-full:999px;
    --nav-h:74px;
  }
  [data-theme="dark"]{
    --green:#7CC46A; --green-2:#9BD27E; --green-soft:#123522; --green-ink:#7CC46A;
    --orange:#FF9A4D; --orange-2:#FFB477; --orange-soft:#33210f; --orange-ink:#FF9A4D;
    --purple:#9b90ff; --purple-soft:#211f3d;
    --teal:#3fbcae; --teal-soft:#12302d;
    --amber:#e5b055; --amber-soft:#2e2413;
    --page:#0e1512; --app:#141b17; --card:#1b241f; --card-2:#212b25;
    --ink:#e8f0ea; --ink-2:#9db0a5; --line:#2b352e;
    --on-brand:#141b17;
    --shadow-s:0 2px 8px rgba(0,0,0,.35);
    --shadow-m:0 10px 28px rgba(0,0,0,.45);
    --shadow-l:0 -6px 24px rgba(0,0,0,.45);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:var(--page); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  @media (min-width:560px){
    body{background:
      radial-gradient(120% 90% at 0% 0%, #cdeed8 0%, transparent 55%),
      radial-gradient(120% 90% at 100% 0%, #dcd8fb 0%, transparent 50%),
      radial-gradient(120% 90% at 100% 100%, #fbe3d2 0%, transparent 50%),
      var(--page); }
    [data-theme="dark"] body{background:var(--page)}
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  ul,ol{margin:0;padding:0;list-style:none}
  h1,h2,h3,h4,p{margin:0}
  h1,h2,h3,.plan-row .t,.brand-name{font-family:var(--font-display)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- shell ---------- */
  .app{
    max-width:480px; margin-inline:auto; background:var(--app); min-height:100dvh;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px); position:relative;
  }
  @media (min-width:560px){
    .app{min-height:calc(100dvh - 40px); margin-block:20px; border-radius:var(--r-xl); box-shadow:var(--shadow-m)}
    .topbar{border-radius:var(--r-xl) var(--r-xl) 0 0}
  }
  .topbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:color-mix(in srgb, var(--app) 88%, transparent); backdrop-filter:blur(14px);
  }
  .icon-btn{
    width:44px;height:44px;flex:none;border-radius:16px;background:var(--card);box-shadow:var(--shadow-s);
    display:grid;place-items:center;color:var(--ink);
  }
  .icon-btn:active{transform:scale(.94)}
  .topbar-title{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
  .brand-mark{width:26px;height:26px}
  .brand-mark svg{display:block;width:100%;height:100%}
  .brand-name{font-weight:400;letter-spacing:-.01em;font-size:17px;color:var(--ink)}
  .brand-name b{font-weight:700}
  /* punto naranja de la i del logotipo: se pinta sobre una ı sin punto, con las
     medidas del punto de la i de Plus Jakarta Sans 700 (em desde el área de contenido) */
  .idot{position:relative}
  .idot::after{content:"";position:absolute;top:.293em;left:.049em;width:.131em;height:.14em;border-radius:50%;background:var(--orange)}

  .screen{padding:6px 18px 0;animation:in .22s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- search ---------- */
  .searchbar{display:flex;gap:10px;align-items:center;margin:6px 0 22px}
  .search-field{
    flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r-full);
    padding:0 18px;height:52px;box-shadow:var(--shadow-s);color:var(--ink-2);
  }
  .search-field input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0}
  .search-field input::placeholder{color:var(--ink-2)}
  .fab{
    width:52px;height:52px;flex:none;border-radius:var(--r-full);display:grid;place-items:center;color:var(--on-brand);
    background:linear-gradient(150deg,var(--green-2),var(--green)); box-shadow:0 8px 18px rgba(22,163,74,.30);
  }
  .fab[aria-pressed="true"]{background:linear-gradient(150deg,var(--orange-2),var(--orange));box-shadow:0 8px 18px rgba(249,115,22,.32)}
  .fab:active{transform:scale(.94)}

  /* ---------- section ---------- */
  .sec{margin-bottom:26px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  .sec-head h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .sec-head p{font-size:13px;color:var(--ink-2)}
  .link{font-size:13px;font-weight:700;color:var(--green-ink);flex:none}

  /* ---------- featured carousel ---------- */
  .rail{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 6px;margin:0 -18px;scroll-snap-type:x mandatory;scroll-padding-inline:18px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .feat{
    flex:none;width:174px;min-height:186px;border-radius:22px;padding:16px;color:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;gap:8px;text-align:left;scroll-snap-align:start;box-shadow:var(--shadow-s);
  }
  .feat:active{transform:scale(.97)}
  .feat.ink{color:var(--on-brand)}
  .feat h3{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .feat .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;position:relative;z-index:1;
    background:rgba(255,255,255,.28);padding:5px 10px;border-radius:var(--r-full);width:fit-content;
    backdrop-filter:blur(3px);
  }
  .feat h3{position:relative;z-index:1}
  .feat .emoji{position:absolute;right:-8px;bottom:-12px;font-size:64px;line-height:1;opacity:.95;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
  .feat::after{content:"";position:absolute;inset:auto -40% -60% auto;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}

  /* ---------- planner ---------- */
  .planner{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow-s)}
  .days{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:none;width:56px;padding:12px 0;border-radius:20px;background:var(--card-2);text-align:center;
    display:grid;gap:2px;justify-items:center;border:2px solid transparent;position:relative;
  }
  .day b{font-size:15px;font-weight:800}
  .day small{font-size:11px;color:var(--ink-2)}
  .day .dot{font-size:17px;margin-top:2px}
  .day[aria-selected="true"]{border-color:var(--orange);background:var(--orange-soft)}
  .day[aria-selected="true"] small{color:var(--ink)}

  }

  .detail-foot{

  .detail-foot b{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .detail-foot .go{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff}
  .detail-foot .go.ink{color:var(--on-brand)}

  /* ---------- cards / notes ---------- */
  .card{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow-s)}
  .card + .card{margin-top:12px}
  .card h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .card h3 .ball{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
  .card p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .card em{font-style:normal;font-weight:700;color:var(--orange-ink)}
  .card strong{color:var(--ink)}
  .card a{color:var(--green-ink);font-weight:700;text-underline-offset:2px}
  .warn{background:var(--orange-soft);box-shadow:none;border:1px solid color-mix(in srgb,var(--orange) 30%,transparent)}
  .warn p{color:var(--ink)}
  .legal-link{display:block;margin:12px auto 0;font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
  .empty{text-align:center;padding:56px 20px;color:var(--ink-2)}
  .empty .big{font-size:52px;margin-bottom:10px}
  .empty p{font-size:14px;max-width:260px;margin-inline:auto}

  /* ---------- bottom nav ---------- */
  .nav{
    position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:480px;margin-inline:auto;
    height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:color-mix(in srgb, var(--card) 94%, transparent);backdrop-filter:blur(16px);
    border-radius:26px 26px 0 0;box-shadow:var(--shadow-l);
    display:flex;align-items:center;justify-content:space-around;padding-inline:10px;
  }
  @media (min-width:560px){.nav{border-radius:26px 26px var(--r-xl) var(--r-xl);bottom:20px;max-width:480px}}
  .nav button{
    width:52px;height:52px;border-radius:20px;display:grid;place-items:center;color:var(--ink-2);position:relative;
    transition:transform .18s ease,background .18s ease,color .18s ease;
  }
  .nav button[aria-current="page"]{
    background:linear-gradient(150deg,var(--orange-2),var(--orange));color:var(--on-brand);
    transform:translateY(-14px);box-shadow:0 10px 20px rgba(249,115,22,.34);
  }
  .nav button:active{transform:scale(.94)}
  .nav button[aria-current="page"]:active{transform:translateY(-14px) scale(.94)}
</style>

 prep:["Hierve la pasta y resérvala con un poco de agua de cocción.","Saltea las espinacas brevemente con unas gotas de aceite.","Bate la mostaza con el aceite, el limón y un poco del agua de cocción hasta emulsionar.","Integra la pasta con la salsa y las espinacas.","Añade el salmón al final para mantener la textura."]},
{id:"co3",cat:"comidas",n:3,kcal:525,e:"🍚",t:"Arroz integral con pescado blanco, pimiento y aceite de hierbas",
 ing:["Arroz integral","Pescado blanco","Pimiento rojo o verde","Aceite de oliva infusionado con hierbas","Zumo de limón","Pimienta y sal con moderación"],
 prep:["Cuece el arroz integral hasta dejarlo casi en su punto.","Saltea el pimiento troceado con el aceite de hierbas.","Añade el pescado blanco en tacos y cocínalo dos o tres minutos por cada lado.","Une el arroz y deja unos minutos para que absorba los aromas.","Sirve con unas gotas de limón, pimienta y hierbas frescas."]},
{id:"co4",cat:"comidas",n:4,kcal:610,e:"🦃",t:"Pavo a la plancha con ensalada templada de pasta, mostaza y hierbas",
 ing:["Pavo (máx. 200 g)","Pasta","Lechuga y tomate","Mostaza","Aceite de oliva","Hierbas y pimienta"],
 prep:["Cocina la pasta, escúrrela y déjala templar.","Haz el pavo a la plancha con poco aceite.","Mezcla la pasta con lechuga troceada, tomate, mostaza, aceite y hierbas.","Sirve el pavo fileteado sobre la ensalada de pasta."]},
{id:"co5",cat:"comidas",n:5,kcal:700,e:"🍗",t:"Pollo a la plancha con arroz integral y calabacín salteado",
 ing:["Pollo (máx. 200 g)","Arroz integral","Calabacín","Aceite de oliva","Hierbas, pimienta y mostaza"],
 prep:["Cuece el arroz integral hasta que quede suelto.","Corta el calabacín en rodajas finas y saltéalo con unas gotas de aceite.","Haz el pollo a la plancha con poco aceite.","Mezcla el arroz con hierbas, pimienta y una mínima cantidad de mostaza.","Sirve el pollo fileteado sobre el arroz con el calabacín al lado."]},
{id:"co6",cat:"comidas",n:6,kcal:590,e:"🥕",t:"Conejo dorado con patata, judías verdes y hierbas",
 ing:["Conejo (máx. 200 g)","Patata","Judías verdes","Aceite de oliva","Hierbas y pimienta"],
 prep:["Dora el conejo a la plancha o a la brasa con una capa ligera de aceite.","Cuece las judías verdes al vapor o hervidas.","Cuece la patata aparte y córtala en rodajas.","Condimenta todo con hierbas y pimienta.","Emplata las judías y la patata como base y el conejo por encima."]},
{id:"co7",cat:"comidas",n:7,kcal:550,e:"🍅",t:"Pasta con atún, tomate fresco, aceitunas y albahaca",
 ing:["Pasta","Atún en lata","Tomate fresco","Aceitunas verdes o negras","Albahaca fresca","Aceite de oliva y pimienta"],
 prep:["Cuece la pasta y reserva un poco de agua.","Calienta aceite de oliva y añade el tomate troceado.","Incorpora el atún, las aceitunas y después la pasta.","Liga con un poco del agua de cocción y termina con albahaca y pimienta."]},
{id:"co8",cat:"comidas",n:8,kcal:430,e:"🐠",t:"Pescado azul a la plancha con ensalada fresca y mostaza",
 ing:["Pescado azul (sardina, trucha, caballa…)","Lechuga","Tomate","Pepino","Aceite de oliva","Mostaza, hierbas y pimienta"],
 prep:["Haz el pescado azul a la plancha con poco aceite.","Prepara una ensalada con lechuga, tomate y pepino.","Aliña la ensalada con aceite de oliva, mostaza, hierbas y pimienta.","Sirve el pescado junto a la ensalada."]},
{id:"co9",cat:"comidas",n:9,kcal:470,e:"🌶️",t:"Pescado blanco con patata, pimiento y mayonesa sin ajo",
 ing:["Pescado blanco","Patata","Pimiento rojo","Mayonesa sin ajo, poca cantidad","Hierbas, pimienta y aceite de oliva"],
 prep:["Haz el pescado blanco a la plancha con muy poco aceite.","Cuece la patata y saltea el pimiento troceado como guarnición.","Añade una pequeña cantidad de mayonesa sin ajo para dar intensidad.","Termina con hierbas y pimienta."]},
{id:"co10",cat:"comidas",n:10,kcal:560,e:"🥖",t:"Pan tostado con conejo desmenuzado, lechuga y mostaza ligera",
 ing:["Conejo (máx. 200 g)","Pan integral","Lechuga","Tomate","Mostaza","Aceite de oliva y hierbas"],
 prep:["Cocina el conejo y desmenúzalo en trozos pequeños.","Tuesta el pan integral.","Mezcla el conejo con una pequeña cantidad de mostaza y hierbas.","Sirve la mezcla sobre el pan con lechuga y rodajas de tomate."]},
{id:"co11",cat:"comidas",n:11,kcal:160,e:"🍳",nuevo:true,t:"Tortilla de claras con calabacín, cebolleta y hierbas",
 ing:["Claras de huevo (3–4)","Calabacín","Tallo verde de cebolleta","Aceite de oliva, unas gotas","Perejil y pimienta"],
 prep:["Corta el calabacín y el tallo verde de cebolleta en trozos pequeños y saltéalos con unas gotas de aceite.","Bate las claras con perejil picado y pimienta.","Vierte las claras sobre las verduras y cocina a fuego medio.","Cuando cuaje, dobla la tortilla y sirve.","Acompaña con pan integral tostado o ensalada."]},
{id:"co12",cat:"comidas",n:12,kcal:520,e:"🥗",nuevo:true,t:"Ensalada completa de pasta con atún, tomate, pepino y aceitunas",
 ing:["Pasta","Atún en lata","Tomate","Pepino","Tallo verde de cebolleta","Aceite de oliva","Hierbas y pimienta"],
 prep:["Cuece la pasta y déjala enfriar.","Trocea el tomate, pepino y el tallo verde de cebolleta.","Mezcla todo con el atún escurrido.","Aliña con aceite de oliva, hierbas y pimienta.","Sirve frío como plato único."]},
{id:"co13",cat:"comidas",n:13,kcal:330,e:"🐟",nuevo:true,t:"Pescado blanco al horno con cama de verduras bajas en FODMAP",
 ing:["Pescado blanco","Calabacín","Pimiento rojo","Tallo verde de cebolleta","Tomate","Aceite de oliva","Hierbas, pimienta y sal con moderación"],
 prep:["Corta todas las verduras en rodajas o tiras y distribúyelas en una fuente de horno.","Aliña las verduras con unas gotas de aceite, hierbas y pimienta.","Coloca el pescado encima.","Hornea a 180 °C unos 20–25 minutos hasta que el pescado esté en su punto.","Sirve directamente de la fuente."]},
{id:"co14",cat:"comidas",n:14,kcal:430,e:"🥬",nuevo:true,t:"Revuelto de claras con salmón ahumado, espinacas y arroz integral",
 ing:["Claras de huevo (3)","Salmón ahumado","Espinacas frescas","Arroz integral","Aceite de oliva, unas gotas","Pimienta y hierbas"],
 prep:["Cuece el arroz integral y resérvalo.","Saltea las espinacas brevemente con unas gotas de aceite.","Añade las claras y remueve hasta que cuajen.","Incorpora el salmón ahumado en tiras al final, fuera del fuego.","Sirve el revuelto sobre el arroz con pimienta y hierbas."]},
{id:"co15",cat:"comidas",n:15,kcal:420,e:"🍆",nuevo:true,t:"Berenjenas rellenas de arroz integral, tomate y queso light",
 ing:["Berenjenas (2)","Arroz integral cocido","Tomate fresco","Queso light rallado","Aceite de oliva","Hierbas, pimienta y sal con moderación"],
 prep:["Corta las berenjenas por la mitad y vacía parte de la pulpa.","Mezcla la pulpa troceada con arroz integral cocido, tomate picado y hierbas.","Rellena las berenjenas con la mezcla.","Cubre con queso light rallado y hornea a 180 °C unos 20 minutos.","Sirve caliente con un hilo de aceite de oliva."]},
{id:"co16",cat:"comidas",n:16,kcal:740,e:"🥦",nuevo:true,t:"Salteado de pollo con brócoli, zanahoria y arroz integral",
 ing:["Pollo (máx. 200 g)","Brócoli","Zanahoria","Arroz integral","Aceite de oliva","Jengibre fresco rallado","Pimienta y hierbas"],
 prep:["Cuece el arroz integral y resérvalo.","Corta el pollo en tiras y saltéalo con unas gotas de aceite y jengibre rallado.","Añade el brócoli en ramilletes y la zanahoria en rodajas finas.","Cocina a fuego fuerte 4–5 minutos removiendo.","Sirve sobre el arroz con pimienta y hierbas."]},
{id:"co17",cat:"comidas",n:17,kcal:470,e:"🍝",nuevo:true,t:"Pasta con berenjenas, tomate y aceitunas",
 ing:["Pasta","Berenjena","Tomate fresco","Aceitunas negras","Aceite de oliva","Albahaca fresca y pimienta"],
 prep:["Cuece la pasta al dente.","Corta la berenjena en dados y saltéala con aceite hasta que esté dorada.","Añade el tomate troceado y las aceitunas.","Mezcla con la pasta y termina con albahaca fresca y pimienta."]},
{id:"co18",cat:"comidas",n:18,kcal:340,e:"🍠",nuevo:true,t:"Boniato asado relleno de atún, pimiento y hierbas",
 ing:["Boniato (1 mediano)","Atún en lata","Pimiento rojo","Aceite de oliva","Zumo de limón","Hierbas y pimienta"],
 prep:["Asa el boniato entero al horno a 200 °C durante 45 minutos.","Ábrelo por la mitad y ahueca ligeramente la pulpa.","Mezcla el atún con el pimiento picado, unas gotas de aceite, limón y hierbas.","Rellena el boniato con la mezcla y termina con pimienta."]},

{id:"co19",cat:"comidas",n:19,kcal:220,e:"🥫",nuevo:true,t:"Calabacines rellenos de atún y tomate al horno",
 ing:["Calabacín (3 medianos)","Atún en lata al natural","Tomate maduro (2)","Tallo verde de cebolleta (2)","Aceite de oliva","Orégano","Pimienta y sal con moderación"],
 prep:["Precalienta el horno a 190 °C. Corta los calabacines por la mitad a lo largo y vacía la pulpa dejando medio centímetro de borde.","Salpimienta las barquitas y hornéalas diez minutos para que se ablanden.","Pica la pulpa reservada, el tomate y el tallo verde de cebolleta y rehógalo todo con aceite de oliva cinco minutos.","Escurre el atún, mézclalo con el sofrito y añade orégano, pimienta y sal.","Rellena las barquitas y hornea 15–18 minutos más, hasta que estén doradas."]},
{id:"co20",cat:"comidas",n:20,kcal:210,e:"🍝",nuevo:true,t:"Espirales de calabacín con salsa de tomate fresco y albahaca",
 ing:["Calabacín (3 grandes)","Tomate maduro (3)","Aceite de oliva infusionado con hierbas","Albahaca fresca","Pimienta y sal"],
 prep:["Corta el calabacín en espirales finas con espiralizador, pelador o mandolina y déjalas en un colador con sal diez minutos para que suelten agua.","Escalda los tomates, pélalos y tritúralos sin afinar demasiado.","Cocina la salsa en una sartén con el aceite infusionado durante 8–10 minutos.","Seca bien las espirales con un paño y saltéalas aparte dos o tres minutos, que queden al dente.","Sirve las espirales con la salsa por encima y remata con albahaca fresca y pimienta."]},
{id:"co21",cat:"comidas",n:21,kcal:340,e:"🍲",nuevo:true,t:"Lasaña de calabacín con pavo y espinacas",
 ing:["Calabacín (3 grandes)","Pavo picado (máx. 200 g)","Espinacas frescas","Tomate triturado natural","Queso light rallado","Aceite de oliva infusionado con hierbas","Nuez moscada, orégano y pimienta"],
 prep:["Precalienta el horno a 180 °C y corta el calabacín en láminas finas a lo largo con mandolina o cuchillo.","Dora el pavo picado con el aceite infusionado, añade el tomate triturado y el orégano y cocina ocho minutos.","Saltea las espinacas aparte hasta que reduzcan y sazónalas con nuez moscada y pimienta.","Monta capas alternas de calabacín, pavo con tomate y espinacas, y termina con una capa de calabacín cubierta de queso light.","Hornea 25–30 minutos hasta que gratine y deja reposar cinco minutos antes de servir."]},
{id:"co22",cat:"comidas",n:22,kcal:320,e:"🍗",nuevo:true,t:"Barquitas de calabacín con pollo desmenuzado y pimiento",
 ing:["Calabacín (3 medianos)","Pollo cocido o a la plancha (máx. 200 g)","Pimiento rojo","Pimiento verde","Tallo verde de cebolleta (2)","Aceite de oliva","Comino, pimienta y sal"],
 prep:["Precalienta el horno a 185 °C. Corta los calabacines por la mitad, vacía la pulpa y hornea las barquitas vacías ocho minutos con un hilo de aceite.","Desmenuza el pollo y pica los pimientos, el tallo verde de cebolleta y la pulpa reservada.","Rehoga los pimientos, la cebolleta y la pulpa con aceite de oliva cinco minutos y sazona con comino, pimienta y sal.","Mezcla el sofrito con el pollo desmenuzado y rellena las barquitas.","Hornea 12–15 minutos más y sirve caliente."]},
{id:"co23",cat:"comidas",n:23,kcal:250,e:"🫚",nuevo:true,t:"Calabacín salteado con pescado blanco y jengibre",
 ing:["Calabacín (2)","Pescado blanco en tacos","Jengibre fresco rallado","Tallo verde de cebolleta (2)","Aceite de oliva","Zumo de limón","Pimienta y sal"],
 prep:["Corta el calabacín en medias lunas no muy finas y pica el tallo verde de cebolleta.","Calienta aceite de oliva en una sartén amplia o wok a fuego fuerte.","Marca los tacos de pescado blanco dos minutos por cada lado, retíralos y resérvalos.","Saltea el calabacín con el jengibre rallado cuatro o cinco minutos, que quede al dente.","Devuelve el pescado a la sartén, añade la cebolleta, el zumo de limón, la pimienta y la sal, y saltea un minuto más."]},

{id:"me1",cat:"meriendas",n:1,kcal:265,e:"🍮",t:"Flan sin huevo con mermelada y nueces",
 ing:["Flan sin huevo","Mermelada sin fructosa","Nueces"],
 prep:["Sirve el flan bien frío.","Añade una pequeña cucharada de mermelada.","Trocea las nueces y espárcelas al final."]},
{id:"me2",cat:"meriendas",n:2,kcal:270,e:"🥄",t:"Yogur desnatado montado con fresas, arándanos y pipas",
 ing:["Yogur descremado sin lactosa","Fresas frescas","Arándanos","Pipas de girasol sin sal","Plátano poco maduro"],
 prep:["Bate ligeramente el yogur.","Trocea las fresas y el plátano.","Reparte encima la fruta y termina con pipas y arándanos.","Sírvelo al momento o deja que repose."]},
{id:"me3",cat:"meriendas",n:3,kcal:200,e:"🍯",t:"Tostaditas integrales con mermelada sin fructosa y pipas",
 ing:["Pan integral","Mermelada sin fructosa","Pipas de girasol sin sal","Canela, opcional"],
 prep:["Tuesta el pan y córtalo en piezas pequeñas.","Extiende una capa fina de mermelada.","Finaliza con pipas de girasol.","Añade un toque de canela si quieres más aroma."]},
{id:"me4",cat:"meriendas",n:4,kcal:410,e:"🥛",t:"Copa de leche sin lactosa con copos de avena, plátano y nueces",
 ing:["Leche desnatada sin lactosa","Copos de avena","Plátano poco maduro","Nueces","Canela"],
 prep:["Sirve la leche en un vaso o cuenco amplio.","Incorpora los copos de avena y deja que se ablanden unos minutos.","Añade el plátano en rodajas finas.","Termina con nueces picadas y canela."]},
{id:"me5",cat:"meriendas",n:5,kcal:140,e:"🧀",t:"Queso light batido con mermelada y arándanos",
 ing:["Queso light","Mermelada sin fructosa","Arándanos"],
 prep:["Bate el queso light hasta que quede más cremoso.","Añade una pequeña cantidad de mermelada.","Termina con arándanos.","Sirve frío."]},
{id:"me6",cat:"meriendas",n:6,kcal:220,e:"🫐",t:"Yogur con nueces, mermelada fina y frambuesas",
 ing:["Yogur descremado sin lactosa","Nueces","Mermelada sin fructosa","Frambuesas"],
 prep:["Sirve el yogur en un vaso.","Añade una pequeña veta de mermelada.","Incorpora nueces y frambuesas.","Mezcla ligeramente solo al final."]},
{id:"me7",cat:"meriendas",n:7,kcal:250,e:"🍊",nuevo:true,t:"Macedonia de frutas bajas en FODMAP con zumo de naranja",
 ing:["Kiwi verde","Fresas","Naranja","Piña (2 rodajas)","Zumo de naranja natural"],
 prep:["Pela y trocea el kiwi, las fresas, la naranja y la piña en dados.","Mezcla en un cuenco y riega con zumo de naranja natural.","Deja reposar unos minutos en frío para que los sabores se integren.","Sirve sola o con un par de nueces picadas por encima."]},
{id:"me8",cat:"meriendas",n:8,kcal:205,e:"🥝",nuevo:true,t:"Yogur desnatado con kiwi rallado, nueces y canela",
 ing:["Yogur descremado sin lactosa","Kiwi verde","Nueces","Canela"],
 prep:["Ralla o trocea el kiwi directamente sobre el yogur.","Añade nueces picadas.","Espolvorea un toque de canela.","Mezcla ligeramente y sirve al momento."]},
{id:"me9",cat:"meriendas",n:9,kcal:225,e:"🍓",nuevo:true,t:"Bol de fresas con yogur desnatado, nueces y coco rallado",
 ing:["Fresas frescas","Yogur descremado sin lactosa","Nueces","Coco rallado (1 cucharada)"],
 prep:["Lava y trocea las fresas en un cuenco.","Añade el yogur por encima.","Esparce las nueces picadas y el coco rallado.","Sirve frío como merienda ligera."]},
{id:"me10",cat:"meriendas",n:10,kcal:225,e:"🍌",nuevo:true,t:"Batido de plátano poco maduro con leche sin lactosa y canela",
 ing:["Plátano poco maduro (1)","Leche desnatada sin lactosa","Canela","Nueces picadas, opcional"],
 prep:["Pela el plátano y bátelo con la leche sin lactosa.","Añade un toque de canela durante el batido.","Sirve frío en un vaso.","Puedes añadir nueces picadas por encima para más textura."]},

{id:"ce1",cat:"cenas",n:1,kcal:490,e:"🐟",t:"Pescado blanco a la plancha con arroz aromático y ensalada verde",
 ing:["Pescado blanco","Arroz integral","Lechuga y pepino","Aceite de oliva","Hierbas, pimienta y sal con moderación"],
 prep:["Cuece el arroz integral.","Haz el pescado a la plancha con poco aceite.","Prepara una ensalada sencilla con lechuga y pepino.","Aliña el arroz con hierbas, pimienta y unas gotas de aceite.","Sirve el pescado junto al arroz y la ensalada."]},
{id:"ce2",cat:"cenas",n:2,kcal:420,e:"🥒",t:"Pescado azul con calabacín a la plancha y hierbas",
 ing:["Pescado azul","Calabacín","Aceite de oliva","Hierbas, pimienta y zumo de limón"],
 prep:["Cocina el pescado azul a la plancha o a la brasa.","Corta el calabacín en rodajas y hazlo a la plancha junto al pescado.","Aliña con zumo de limón, hierbas y pimienta.","Sirve con un hilo de aceite de oliva."]},
{id:"ce3",cat:"cenas",n:3,kcal:560,e:"🔥",t:"Conejo a la brasa con pan integral tostado, tomate y hierbas",
 ing:["Conejo (máx. 200 g)","Pan integral","Tomate fresco","Aceite de oliva","Hierbas y pimienta"],
 prep:["Cocina el conejo a la brasa o a la plancha.","Tuesta el pan integral y coloca rodajas de tomate encima.","Adereza el conejo con hierbas y pimienta al final.","Sirve con el pan tostado con tomate."]},
{id:"ce4",cat:"cenas",n:4,kcal:380,e:"🥫",t:"Atún templado con patata, tomate cherry y mostaza suave",
 ing:["Atún en lata","Patata cocida","Tomate cherry","Mostaza","Hierbas, aceite de oliva y pimienta"],
 prep:["Cuece la patata y córtala en rodajas.","Templa la patata con unas gotas de aceite y el tomate troceado.","Añade el atún al final para que solo tome temperatura.","Integra una pequeña cantidad de mostaza.","Finaliza con hierbas y pimienta."]},
{id:"ce5",cat:"cenas",n:5,kcal:425,e:"🍣",t:"Salmón ahumado templado con arroz integral, espinacas y hierbas",
 ing:["Salmón ahumado","Arroz integral","Espinacas frescas","Aceite de oliva","Hierbas y pimienta"],
 prep:["Cuece el arroz integral y mantenlo caliente.","Saltea las espinacas brevemente con unas gotas de aceite.","Mezcla el arroz con las espinacas, hierbas y pimienta.","Templa muy ligeramente el salmón y colócalo encima."]},
{id:"ce6",cat:"cenas",n:6,kcal:485,e:"🐟",t:"Sardinas al horno con patata, pimiento y limón",
 ing:["Sardinas frescas","Patata cocida","Pimiento rojo","Zumo de limón","Aceite de oliva","Perejil, pimienta y sal con moderación"],
 prep:["Precalienta el horno a 200 °C.","Coloca la patata en rodajas y el pimiento en tiras como base en una fuente.","Dispón las sardinas limpias por encima y riega con aceite y limón.","Hornea 12–15 minutos, hasta que la piel quede dorada.","Termina con perejil picado y pimienta."]},
{id:"ce7",cat:"cenas",n:7,kcal:405,e:"🥬",t:"Pavo fileteado con ensalada de lechuga, tomate, pepino y mostaza",
 ing:["Pavo (máx. 200 g)","Lechuga","Tomate","Pepino","Mostaza","Aceite de oliva y pimienta"],
 prep:["Haz el pavo a la plancha con muy poco aceite.","Prepara una ensalada con lechuga, tomate y pepino.","Aliña la ensalada con aceite, mostaza y pimienta.","Sirve el pavo cortado en tiras junto a la ensalada."]},
{id:"ce8",cat:"cenas",n:8,kcal:315,e:"🥕",t:"Pescado blanco con crema ligera de queso descremado, zanahoria y hierbas",
 ing:["Pescado blanco","Queso descremado","Zanahoria","Hierbas, pimienta y aceite de oliva"],
 prep:["Cocina el pescado blanco a la plancha con una mínima cantidad de aceite.","Cuece o ralla la zanahoria como guarnición.","Mezcla el queso descremado con hierbas y pimienta.","Coloca una cucharada de esa crema sobre el pescado y sirve con la zanahoria."]},
{id:"ce9",cat:"cenas",n:9,kcal:160,e:"🍳",nuevo:true,t:"Tortilla de claras con espinacas, tomate y orégano",
 ing:["Claras de huevo (3)","Espinacas frescas","Tomate","Aceite de oliva, unas gotas","Orégano, pimienta y hierbas"],
 prep:["Saltea las espinacas y el tomate troceado con unas gotas de aceite.","Bate las claras con pimienta y hierbas.","Vierte sobre las verduras y cocina a fuego medio.","Cuando cuaje por abajo, dobla y termina con orégano.","Acompaña con pan integral si lo deseas."]},
{id:"ce10",cat:"cenas",n:10,kcal:280,e:"🫛",nuevo:true,t:"Ensalada tibia de judías verdes con atún, tomate y aceite de oliva",
 ing:["Judías verdes","Atún en lata","Tomate","Tallo verde de cebolleta","Aceite de oliva","Hierbas y pimienta"],
 prep:["Cuece las judías verdes al vapor o hervidas hasta que estén tiernas pero firmes.","Trocea el tomate y el tallo verde de cebolleta.","Mezcla las judías tibias con el tomate, la cebolleta y el atún.","Aliña con aceite de oliva, hierbas y pimienta.","Sirve templada como cena ligera y nutritiva."]},
{id:"ce11",cat:"cenas",n:11,kcal:280,e:"🥗",nuevo:true,t:"Pescado blanco al papillote con zanahoria, calabacín y limón",
 ing:["Pescado blanco","Zanahoria en juliana","Calabacín en rodajas","Zumo de limón","Aceite de oliva","Hierbas frescas y pimienta"],
 prep:["Coloca el pescado sobre un trozo grande de papel de horno.","Distribuye la zanahoria y el calabacín alrededor.","Aliña con zumo de limón, aceite, hierbas y pimienta.","Cierra el paquete y hornea a 180 °C durante 15–18 minutos.","Sirve directamente abriendo el papillote en el plato."]},
{id:"ce12",cat:"cenas",n:12,kcal:225,e:"🍆",nuevo:true,t:"Berenjenas a la plancha con tomate, queso light y orégano",
 ing:["Berenjena","Tomate fresco","Queso light","Orégano","Aceite de oliva","Pimienta"],
 prep:["Corta la berenjena en rodajas gruesas y hazla a la plancha con unas gotas de aceite.","Coloca rodajas de tomate encima de cada berenjena.","Añade queso light y gratina unos segundos.","Termina con orégano y pimienta.","Sirve como cena ligera con pan integral."]},

{id:"ce13",cat:"cenas",n:13,kcal:190,e:"🍳",nuevo:true,t:"Tortilla de claras con calabacín rallado y hierbas",
 ing:["Claras de huevo (4)","Calabacín (1 mediano)","Aceite de oliva, unas gotas","Perejil y cebollino frescos","Pimienta y sal"],
 prep:["Ralla el calabacín grueso, déjalo escurrir con sal cinco minutos y sécalo con un paño.","Bate las claras con el perejil, el cebollino, la pimienta y la sal.","Saltea el calabacín rallado dos o tres minutos con unas gotas de aceite hasta que pierda humedad.","Vierte las claras sobre el calabacín y cuaja a fuego suave tapado tres o cuatro minutos.","Dale la vuelta con ayuda de un plato, cocina dos minutos más y sirve caliente o templada."]},
{id:"ce14",cat:"cenas",n:14,kcal:155,e:"🥗",nuevo:true,t:"Ensalada tibia de calabacín a la plancha con limón y pipas",
 ing:["Calabacín (2)","Tomate maduro","Rúcula o lechuga","Pipas de girasol sin sal","Aceite de oliva virgen","Zumo de limón","Hierbas provenzales, pimienta y sal"],
 prep:["Corta el calabacín en rodajas de medio centímetro y píntalas con aceite de oliva.","Márcalas en la plancha bien caliente dos o tres minutos por cada lado y salpimienta al retirarlas.","Coloca la rúcula o la lechuga como base y reparte encima las rodajas tibias.","Añade el tomate troceado alrededor y espolvorea las pipas y las hierbas provenzales.","Aliña con aceite de oliva y zumo de limón justo antes de servir."]},
{id:"ce15",cat:"cenas",n:15,kcal:160,e:"🥚",nuevo:true,t:"Nidos de calabacín al horno con huevo y pimiento",
 ing:["Calabacín (2)","Huevo (2)","Pimiento rojo","Tomate triturado natural","Aceite de oliva","Orégano, pimienta y sal"],
 prep:["Precalienta el horno a 200 °C. Ralla el calabacín grueso y escúrrelo bien con un paño.","Pica el pimiento muy fino y mézclalo con el calabacín, una cucharada de aceite, el orégano y la sal.","Reparte la mezcla en dos moldes individuales formando un hueco en el centro.","Pon una cucharada de tomate triturado en el fondo de cada nido y casca un huevo encima.","Hornea 14–18 minutos, hasta que la clara cuaje y la yema siga jugosa, y sirve al momento."]},
{id:"ce16",cat:"cenas",n:16,kcal:195,e:"🧀",nuevo:true,t:"Calabacín gratinado con queso light, pan integral y orégano",
 ing:["Calabacín (2 grandes)","Queso light rallado","Pan integral rallado","Aceite de oliva","Orégano","Pimienta y sal"],
 prep:["Precalienta el horno a 200 °C, con el gratinador si lo tiene.","Corta el calabacín en rodajas de un centímetro y colócalas en una sola capa en la fuente.","Salpimienta, riega con un hilo de aceite de oliva y espolvorea el orégano.","Mezcla el queso light rallado con el pan integral rallado y cubre las rodajas con la mezcla.","Gratina 12–15 minutos, hasta que la superficie esté dorada y crujiente."]},
{id:"ce17",cat:"cenas",n:17,kcal:105,e:"🌿",nuevo:true,t:"Calabacín a la plancha con hierbas provenzales y limón",
 ing:["Calabacín (2)","Aceite de oliva virgen","Hierbas provenzales (tomillo, romero, mejorana)","Zumo de limón","Pimienta y sal"],
 prep:["Corta el calabacín en bastones gruesos o en rodajas diagonales de un centímetro.","Mézclalo en un bol con un hilo de aceite, las hierbas provenzales, la pimienta y la sal.","Calienta la plancha a fuego fuerte hasta que humee ligeramente.","Cocina el calabacín sin moverlo dos o tres minutos por cada lado, hasta que tenga marcas doradas.","Aliña con el zumo de limón y sirve al momento, solo o como guarnición de pescado o carne a la plancha."]},
/* ---- SOPAS Y CALDOS ---- */
{id:"so1",cat:"sopas",n:1,kcal:380,e:"🍗",nuevo:true,t:"Caldo depurativo de pollo con zanahoria, nabo y hierbas",
 ing:["Pollo (carcasa o muslo, máx. 200 g)","Zanahoria (2)","Nabo (1)","Tallo verde de cebolleta","Hierbas frescas (perejil, tomillo)","Pimienta y sal con moderación"],
 prep:["Pon el pollo en una olla con agua fría y lleva a ebullición.","Retira la espuma y añade la zanahoria y el nabo pelados y troceados.","Agrega el tallo verde de cebolleta y las hierbas.","Cocina a fuego suave durante 45 minutos.","Cuela el caldo, desmenuza algo de pollo y sirve con la verdura."]},
{id:"so2",cat:"sopas",n:2,kcal:295,e:"🍅",nuevo:true,t:"Sopa de tomate asado con albahaca y pan integral",
 ing:["Tomates maduros (4–5)","Zanahoria (1)","Tallo verde de cebolleta","Albahaca fresca","Aceite de oliva","Pan integral tostado","Pimienta y sal con moderación"],
 prep:["Corta los tomates por la mitad y ásalos en el horno a 200 °C durante 20 minutos con la zanahoria.","Saltea el tallo verde de cebolleta con unas gotas de aceite.","Añade los tomates y la zanahoria asados con un poco de agua y tritura todo.","Calienta, rectifica de sal y pimienta.","Sirve con albahaca fresca y pan integral tostado."]},
{id:"so3",cat:"sopas",n:3,kcal:365,e:"🐟",nuevo:true,t:"Caldo de pescado con patata, pimiento y hierbas",
 ing:["Pescado blanco (restos o filetes)","Patata (1 mediana)","Pimiento rojo","Tallo verde de cebolleta","Aceite de oliva","Perejil fresco","Pimienta y sal con moderación"],
 prep:["Hierve el pescado con agua, sal y pimienta durante 15 minutos y retíralo.","En el caldo, añade la patata pelada y troceada y el pimiento.","Cocina hasta que la patata esté tierna.","Desmenuza el pescado y devuélvelo al caldo.","Sirve con un chorrito de aceite de oliva y perejil fresco."]},
{id:"so4",cat:"sopas",n:4,kcal:640,e:"🍚",nuevo:true,t:"Sopa de arroz integral con pollo desmenuzado y espinacas",
 ing:["Arroz integral","Pollo (máx. 200 g)","Espinacas frescas","Zanahoria","Aceite de oliva","Hierbas, pimienta y sal con moderación"],
 prep:["Cuece el pollo en agua con sal y reserva el caldo.","Añade el arroz integral y la zanahoria troceada al caldo.","Cocina hasta que el arroz esté tierno.","Incorpora las espinacas al final para que solo se ablanden.","Desmenuza el pollo y añádelo a la sopa. Sirve caliente."]},
{id:"so5",cat:"sopas",n:5,kcal:305,e:"🥬",nuevo:true,t:"Minestrone bajo en FODMAP con calabacín, judías verdes y tomate",
 ing:["Calabacín","Judías verdes","Tomate fresco","Patata (1 pequeña)","Zanahoria","Tallo verde de cebolleta","Aceite de oliva","Albahaca, pimienta y sal"],
 prep:["Calienta aceite de oliva y saltea el tallo verde de cebolleta.","Añade la zanahoria y la patata troceadas y cubre con agua o caldo.","Cocina 10 minutos y agrega el calabacín, las judías verdes y el tomate.","Deja hervir a fuego suave otros 10–12 minutos.","Sirve caliente con albahaca fresca y un hilo de aceite."]},
{id:"so6",cat:"sopas",n:6,kcal:320,e:"🥕",nuevo:true,t:"Crema de zanahoria con jengibre y aceite de oliva",
 ing:["Zanahorias (4)","Patata (1 pequeña)","Jengibre fresco (1 cm)","Aceite de oliva","Pimienta y sal con moderación"],
 prep:["Pela y trocea las zanahorias y la patata.","Cuécelas en agua o caldo de verduras unos 20 minutos.","Añade el jengibre rallado y tritura todo hasta obtener una crema fina.","Rectifica de sal y pimienta.","Sirve con un hilo de aceite de oliva y pimienta."]},
{id:"so7",cat:"sopas",n:7,kcal:350,e:"🍲",nuevo:true,t:"Caldo reconfortante de jengibre con zanahoria, nabo y arroz",
 ing:["Zanahoria (2)","Nabo (1)","Jengibre fresco (1 cm)","Arroz integral (un puñado)","Aceite de oliva","Pimienta y sal"],
 prep:["Pela y trocea la zanahoria y el nabo.","Ponlos en una olla con agua, el jengibre pelado y el arroz.","Cocina a fuego suave durante 30 minutos.","Retira el trozo de jengibre (o déjalo si te gusta más intenso).","Sirve caliente con un chorrito de aceite de oliva."]},
{id:"so8",cat:"sopas",n:8,kcal:275,e:"🥦",nuevo:true,t:"Crema de brócoli con patata y nuez moscada",
 ing:["Brócoli (1 cabeza pequeña)","Patata (1)","Aceite de oliva","Pimienta, nuez moscada y sal"],
 prep:["Trocea el brócoli y la patata y cuécelos en agua con sal 15 minutos.","Escurre reservando parte del caldo.","Tritura añadiendo caldo hasta lograr la textura deseada.","Termina con un hilo de aceite de oliva, nuez moscada y pimienta."]},

{id:"so9",cat:"sopas",n:9,kcal:260,e:"🥒",nuevo:true,t:"Sopa de calabacín con arroz integral y perejil",
 ing:["Calabacín (2)","Arroz integral","Zanahoria","Tallo verde de cebolleta (2)","Caldo de pollo casero sin ajo ni cebolla","Aceite de oliva infusionado con hierbas","Perejil fresco","Pimienta y sal"],
 prep:["Pica el tallo verde de cebolleta y la zanahoria en dados pequeños y corta el calabacín en medias lunas.","Rehoga la cebolleta y la zanahoria en el aceite infusionado tres minutos a fuego suave.","Añade el calabacín, sofríe dos minutos más y vierte el caldo hasta que rompa a hervir.","Incorpora el arroz integral, baja el fuego y cocina tapado 25–30 minutos hasta que esté tierno.","Rectifica de pimienta y sal y sirve con perejil fresco picado por encima."]},
/* ---- PURÉS ---- */
{id:"pu1",cat:"pures",n:1,kcal:265,e:"🥒",nuevo:true,t:"Puré suave de calabacín con patata y aceite de oliva",
 ing:["Calabacín (2 medianos)","Patata (1)","Aceite de oliva","Pimienta y sal","Hierbas frescas (perejil)"],
 prep:["Pela y trocea el calabacín y la patata.","Cuécelos en agua con sal hasta que estén tiernos, unos 15 minutos.","Escurre reservando algo de líquido y tritura hasta obtener un puré fino.","Ajusta la textura con el líquido reservado.","Sirve con un hilo de aceite de oliva, pimienta y perejil."]},
{id:"pu2",cat:"pures",n:2,kcal:345,e:"🥕",nuevo:true,t:"Puré de zanahoria y boniato con jengibre fresco",
 ing:["Zanahorias (3)","Boniato (1 mediano)","Jengibre fresco (1 cm)","Aceite de oliva","Pimienta y sal"],
 prep:["Pela y trocea las zanahorias y el boniato.","Cuécelos en agua con sal durante 20 minutos hasta que estén blandos.","Añade el jengibre rallado y tritura todo hasta obtener un puré cremoso.","Ajusta la sal y pimienta.","Sirve caliente con un chorrito de aceite de oliva."]},
{id:"pu3",cat:"pures",n:3,kcal:275,e:"🥦",nuevo:true,t:"Puré de brócoli con patata y nuez moscada",
 ing:["Brócoli (1 cabeza)","Patata (1 mediana)","Aceite de oliva","Nuez moscada","Pimienta y sal"],
 prep:["Cuece el brócoli en ramilletes junto con la patata troceada durante 15 minutos.","Escurre y tritura añadiendo un poco de agua de cocción si es necesario.","Añade la nuez moscada rallada, sal y pimienta.","Remueve bien y sirve caliente con aceite de oliva."]},
{id:"pu4",cat:"pures",n:4,kcal:265,e:"🎃",nuevo:true,t:"Puré de calabaza japonesa con canela y aceite de oliva",
 ing:["Calabaza japonesa (kabocha)","Patata (1 pequeña)","Canela","Aceite de oliva","Pimienta y sal"],
 prep:["Pela y trocea la calabaza japonesa y la patata.","Cuécelas en agua con sal hasta que estén muy tiernas.","Tritura todo hasta obtener una textura suave.","Añade un toque de canela, pimienta y sal.","Sirve caliente con un hilo de aceite de oliva."]},
{id:"pu5",cat:"pures",n:5,kcal:305,e:"🥬",nuevo:true,t:"Puré de espinacas con patata y aceite de oliva",
 ing:["Espinacas frescas (200 g)","Patata (1 grande)","Aceite de oliva","Pimienta, nuez moscada y sal"],
 prep:["Cuece la patata pelada y troceada durante 15 minutos.","Añade las espinacas los últimos 3 minutos de cocción.","Escurre y tritura todo junto hasta obtener un puré verde homogéneo.","Sazona con nuez moscada, pimienta y sal.","Sirve con un chorrito generoso de aceite de oliva."]},
{id:"pu6",cat:"pures",n:6,kcal:270,e:"🫛",nuevo:true,t:"Puré cremoso de judía verde con patata y hierbas",
 ing:["Judías verdes (200 g)","Patata (1 mediana)","Aceite de oliva","Hierbas frescas (perejil, eneldo)","Pimienta y sal"],
 prep:["Cuece las judías verdes y la patata troceada en agua con sal durante 18 minutos.","Escurre reservando líquido y tritura hasta obtener un puré suave.","Ajusta la consistencia con el líquido de cocción.","Añade hierbas frescas picadas, pimienta y sal.","Sirve caliente con aceite de oliva."]},
{id:"pu7",cat:"pures",n:7,kcal:155,e:"🍆",nuevo:true,t:"Puré de berenjena asada con limón y comino",
 ing:["Berenjenas (2)","Zumo de limón","Comino","Aceite de oliva","Pimienta y sal"],
 prep:["Pincha las berenjenas y ásalas en el horno a 200 °C durante 35–40 minutos.","Deja enfriar, pela y tritura la pulpa.","Añade el zumo de limón, el comino, sal y pimienta.","Mezcla bien y sirve con un hilo de aceite de oliva.","Ideal como guarnición o con pan integral tostado."]},

{id:"pu8",cat:"pures",n:8,kcal:200,e:"🌿",nuevo:true,t:"Crema de calabacín y espinacas con nuez moscada",
 ing:["Calabacín (2 medianos)","Espinacas frescas","Patata (1 pequeña)","Tallo verde de cebolleta (2)","Leche desnatada sin lactosa","Aceite de oliva","Nuez moscada, pimienta y sal"],
 prep:["Pela y trocea la patata, corta el calabacín y pica el tallo verde de cebolleta.","Rehoga la cebolleta en aceite de oliva dos minutos a fuego medio.","Añade la patata y el calabacín, cubre con agua y cocina quince minutos hasta que la patata esté tierna.","Incorpora las espinacas lavadas en los tres últimos minutos de cocción.","Tritura hasta obtener una crema fina, aligérala con la leche sin lactosa y sazona con nuez moscada, pimienta y sal."]},
/* ---- RECETAS FRÍAS ---- */
{id:"fr1",cat:"frias",n:1,kcal:290,e:"🍅",nuevo:true,t:"Gazpacho suave de tomate y pepino bajo en FODMAP",
 ing:["Tomates maduros (4)","Pepino (½)","Pimiento rojo (½)","Aceite de oliva","Vinagre de vino","Pan integral duro (opcional)","Pimienta y sal"],
 prep:["Trocea los tomates, el pepino y el pimiento.","Tritura todo junto con aceite de oliva, vinagre, sal y pimienta.","Si usas pan, remójalo antes y añádelo a la mezcla.","Pasa por un colador si prefieres una textura fina.","Sirve muy frío con dados de pepino y pimiento por encima."]},
{id:"fr2",cat:"frias",n:2,kcal:505,e:"🍚",nuevo:true,t:"Ensalada de arroz integral con atún, tomate y aceitunas",
 ing:["Arroz integral cocido","Atún en lata","Tomate","Aceitunas verdes","Pepino","Aceite de oliva","Zumo de limón y hierbas"],
 prep:["Deja enfriar el arroz integral.","Trocea el tomate, el pepino y las aceitunas.","Mezcla todo con el atún escurrido.","Aliña con aceite de oliva, zumo de limón y hierbas.","Sirve frío como ensalada completa."]},
{id:"fr3",cat:"frias",n:3,kcal:230,e:"🥒",nuevo:true,t:"Carpaccio de calabacín con limón, rúcula y nueces",
 ing:["Calabacín (2)","Rúcula","Nueces picadas","Zumo de limón","Aceite de oliva virgen","Pimienta negra"],
 prep:["Corta el calabacín en láminas muy finas con mandolina o pelador.","Extiéndelas en un plato y aliña con limón, aceite y pimienta.","Deja marinar diez minutos en frío.","Reparte la rúcula y las nueces picadas por encima antes de servir."]},
{id:"fr4",cat:"frias",n:4,kcal:420,e:"🥔",nuevo:true,t:"Ensalada de patata con huevo duro, pepino y mostaza",
 ing:["Patatas (2 medianas)","Huevo duro (1)","Pepino","Mostaza","Aceite de oliva","Hierbas frescas y pimienta"],
 prep:["Cuece las patatas con piel, pélalas y córtalas en dados cuando estén frías.","Pela y trocea el huevo duro.","Trocea el pepino en medias lunas.","Aliña con mostaza, aceite de oliva, hierbas y pimienta.","Mezcla con cuidado y sirve a temperatura ambiente o frío."]},
{id:"fr5",cat:"frias",n:5,kcal:360,e:"🌿",nuevo:true,t:"Taboulé de arroz con pepino, tomate cherry y hierbas frescas",
 ing:["Arroz integral cocido","Pepino","Tomates cherry","Hierbas frescas (perejil, menta)","Zumo de limón","Aceite de oliva","Pimienta y sal"],
 prep:["Deja enfriar completamente el arroz integral.","Trocea el pepino en dados pequeños y los tomates cherry por la mitad.","Pica las hierbas frescas finamente.","Mezcla todo y aliña con zumo de limón, aceite de oliva, sal y pimienta.","Sirve frío como acompañamiento o plato ligero."]},
{id:"fr6",cat:"frias",n:6,kcal:150,e:"🥬",nuevo:true,t:"Rollitos de lechuga con salmón ahumado, pepino y eneldo",
 ing:["Hojas grandes de lechuga","Salmón ahumado","Pepino en bastones","Eneldo fresco","Zumo de limón","Pimienta"],
 prep:["Lava y seca las hojas de lechuga.","Coloca sobre cada una una loncha de salmón y unos bastones de pepino.","Añade eneldo, pimienta y unas gotas de limón.","Enrolla y sirve frío como plato ligero."]},
{id:"fr7",cat:"frias",n:7,kcal:210,e:"🍆",nuevo:true,t:"Ensalada de berenjena asada con tomate, aceitunas y hierbas",
 ing:["Berenjena (1 grande)","Tomate fresco","Aceitunas negras","Aceite de oliva","Vinagre de vino","Albahaca fresca","Pimienta y sal"],
 prep:["Asa la berenjena entera en el horno a 200 °C hasta que esté blanda.","Deja enfriar, pela y córtala en tiras.","Mezcla con el tomate troceado y las aceitunas.","Aliña con aceite de oliva, vinagre, albahaca, sal y pimienta.","Sirve a temperatura ambiente o fría."]},
{id:"fr8",cat:"frias",n:8,kcal:310,e:"🥕",nuevo:true,t:"Ensalada de zanahoria rallada con naranja, nueces y limón",
 ing:["Zanahorias (3)","Naranja (1)","Nueces","Zumo de limón","Aceite de oliva","Pimienta y sal"],
 prep:["Pela y ralla las zanahorias.","Pela la naranja y córtala en gajos o dados.","Mezcla la zanahoria con la naranja y las nueces troceadas.","Aliña con zumo de limón, aceite de oliva, sal y pimienta.","Sirve fría como entrante o guarnición."]},

{id:"fr9",cat:"frias",n:9,kcal:150,e:"🧊",nuevo:true,t:"Crema fría de calabacín, pepino y menta",
 ing:["Calabacín (2 medianos)","Pepino (medio)","Tallo verde de cebolleta (2)","Menta fresca","Yogur descremado sin lactosa, opcional","Aceite de oliva virgen","Zumo de limón","Pimienta blanca y sal"],
 prep:["Trocea el calabacín y el pepino y pica el tallo verde de cebolleta.","Cuece el calabacín y la cebolleta doce minutos en agua con sal, hasta que estén tiernos.","Escurre reservando medio vaso del caldo y añade el pepino crudo y las hojas de menta.","Tritura hasta obtener una crema fina y ajústala con el caldo reservado si queda espesa.","Añade el zumo de limón y la pimienta blanca y enfría al menos dos horas antes de servir con un hilo de aceite."]},
{id:"fr10",cat:"frias",n:10,kcal:130,e:"🐟",nuevo:true,t:"Rollitos de calabacín con salmón ahumado y rúcula",
 ing:["Calabacín (2 grandes)","Salmón ahumado","Rúcula","Eneldo fresco","Aceite de oliva, unas gotas","Zumo de limón","Pimienta"],
 prep:["Corta el calabacín en láminas finas a lo largo con mandolina o pelador.","Si quedan gruesas, márcalas treinta segundos por cada lado en la plancha y déjalas enfriar.","Pincela cada lámina con unas gotas de aceite y limón y añade pimienta y eneldo.","Coloca una hoja de rúcula y una tira de salmón ahumado sobre cada lámina y enróllalas con cuidado.","Sujétalas con un palillo si hace falta y sirve frías como entrante o cena ligera."]},
/* ---- COCIDOS Y GUISOS ---- */
{id:"gc1",cat:"guisos",n:1,kcal:660,e:"🍗",nuevo:true,t:"Cocido ligero de pollo con patata, zanahoria y judía verde",
 ing:["Pollo (máx. 200 g)","Patata (1 mediana)","Zanahoria (2)","Judías verdes","Nabo (1 pequeño)","Aceite de oliva","Pimienta, sal y hierbas"],
 prep:["Pon el pollo en una olla con agua fría y lleva a ebullición. Retira la espuma.","Añade la patata, zanahoria y nabo pelados y troceados.","Cocina a fuego medio 25 minutos.","Agrega las judías verdes cortadas y cocina 10 minutos más.","Sirve el caldo con las verduras y el pollo troceado, con un chorrito de aceite."]},
{id:"gc2",cat:"guisos",n:2,kcal:460,e:"🐟",nuevo:true,t:"Estofado de pescado blanco con patata, tomate y pimiento",
 ing:["Pescado blanco (2 filetes)","Patata (1)","Tomate fresco (2)","Pimiento rojo","Tallo verde de cebolleta","Aceite de oliva","Perejil, pimienta y sal"],
 prep:["Saltea el tallo verde de cebolleta y el pimiento troceado con aceite de oliva.","Añade el tomate pelado y troceado y cocina 5 minutos.","Incorpora la patata en rodajas finas y cubre con agua.","Cuando la patata esté casi tierna, coloca los filetes de pescado encima.","Cocina 8–10 minutos más a fuego suave. Sirve con perejil fresco."]},
{id:"gc3",cat:"guisos",n:3,kcal:645,e:"🐰",nuevo:true,t:"Guiso de conejo con zanahoria, nabo y hierbas provenzales",

function listOf(rs, emptyMsg){
  if(!rs.length) return `<div class="empty"><div class="big">🍽️</div><p>${emptyMsg}</p></div>`;
  return `<div class="list">${rs.map(itemCard).join("")}</div>`;
}

function planRows(){
  const day = PLAN[planDay];
  const total = kcalDia(planDay);
  const filas = day.s.map((id,i) => {
    const r = BY_ID[id];
    return `<button class="plan-row" data-go="#/r/${r.id}">
      <span class="slot">${SLOTS[i]}</span>
      <span class="t">${esc(r.t)}<em>${r.kcal} kcal</em></span>
      <span class="e">${r.e}</span>
    </button>`;
  }).join("");
  return filas + `<div class="plan-total">
      <span>Total del día</span>
      <b>${total} kcal</b>
      <small>objetivo ~${KCAL_OBJETIVO}</small>
    </div>`;
}

function renderResults(){
  const box = $("#results"), sections = $("#home-sections");
  if(!box) return;
  const q = query.trim().toLowerCase();
  if(!q && !onlyNew){ box.innerHTML = ""; sections.style.display = ""; return; }
  sections.style.display = "none";
  let rs = R;
  if(onlyNew) rs = rs.filter(r => r.nuevo);
  if(q) rs = rs.filter(r => (r.t + " " + r.ing.join(" ") + " " + CATS[r.cat].label).toLowerCase().includes(q));
  box.innerHTML = `<div class="sec-head"><div><h2>${rs.length} resultado${rs.length===1?"":"s"}</h2>
    <p>${onlyNew ? "Solo recetas nuevas" : "Coincidencias en título e ingredientes"}</p></div></div>
    ${listOf(rs, "Ningún plato coincide con esa búsqueda dentro de la lista permitida.")}`;
}

/* ============================ RENDER ============================ */
const NAV = [
  {k:"home",  hash:"#/",            icon:"home",  label:"Inicio"},
  {k:"cat",   hash:"#/cat/comidas", icon:"book",  label:"Recetas"},
  {k:"freq",  hash:"#/frecuencias", icon:"cal",   label:"Frecuencias"},
  {k:"guia",  hash:"#/guia",        icon:"info",  label:"Guía"}
];

function route(){
  const h = location.hash.replace(/^#\/?/, "");
  if(h.startsWith("cat/"))  return {view:"cat",  key:h.slice(4)};
  if(h.startsWith("r/"))    return {view:"recipe", key:h.slice(2)};
  if(h === "frecuencias")   return {view:"freq"};
  if(h === "guia")          return {view:"guia"};
  if(h === "legal")         return {view:"legal"};
  return {view:"home"};
}

function themeIcon(){
  return document.documentElement.dataset.theme === "dark" ? I.sun : I.moon;
}

function render(){
  const {view, key} = route();
  const back = view === "recipe" || view === "cat" || view === "legal";
  const titles = {recipe:"Receta", cat:CATS[key]?.label || "Recetas", freq:"Frecuencias", guia:"Guía", legal:"Aviso legal"};

  $("#topbar").innerHTML = `
    ${back
      ? `<button class="icon-btn" id="back" aria-label="Volver">${I.back}</button>`
      : `<button class="icon-btn" data-go="#/cat/desayunos" aria-label="Ver categorías">${I.grid}</button>`}
    ${view === "home"
      ? `<div class="brand"><span class="brand-mark">${I.brand}</span><span class="brand-name"><span class="sr">ZampiFood</span><span aria-hidden="true"><b>Zamp<span class="idot">ı</span></b>Food</span></span></div>`
      : `<div class="topbar-title">${titles[view]}</div>`}
    <button class="icon-btn" id="theme" aria-label="Cambiar tema">${themeIcon()}</button>`;

  const screens = {home:viewHome, cat:()=>viewCat(CATS[key]?key:"desayunos"), recipe:()=>viewRecipe(key), freq:viewFreq, guia:viewGuia, legal:viewLegal};
  $("#screen").innerHTML = screens[view]();

  const activeKey = view === "recipe" ? "cat" : view;
  $("#nav").innerHTML = NAV.map(n => `
    <button data-go="${n.hash}" aria-label="${n.label}" ${n.k===activeKey ? 'aria-current="page"' : ""}>
      ${I[n.icon]}
    </button>`).join("");

  if(view === "home"){
    renderResults();
    const q = $("#q");
    q.addEventListener("input", e => { query = e.target.value; renderResults(); });
    $("#filter").addEventListener("click", e => {
      onlyNew = !onlyNew;
      e.currentTarget.setAttribute("aria-pressed", onlyNew);
      renderResults();
    });
    $("#days").addEventListener("click", e => {
      const b = e.target.closest("[data-day]"); if(!b) return;
      planDay = +b.dataset.day;
      [...$("#days").children].forEach((el,i) => el.setAttribute("aria-selected", i === planDay));
      $("#plan-list").innerHTML = planRows();
    });
  }
  if(view === "cat"){
    const active = $('.chip[aria-pressed="true"]');
    if(active) active.scrollIntoView({block:"nearest", inline:"center"});
  }
  if(back) $("#back").addEventListener("click", () => history.length > 1 ? history.back() : go("#/"));
  $("#theme").addEventListener("click", toggleTheme);
  window.scrollTo(0, 0);
}

function toggleTheme(){
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  localStorage.setItem("recetario:tema", next);
  document.querySelector('meta[name="theme-color"]').content = next === "dark" ? "#0e1512" : "#eaf7ee";
  $("#theme").innerHTML = themeIcon();
}

/* delegación global: navegación */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g){ e.preventDefault(); go(g.dataset.go); }
});

window.addEventListener("hashchange", render);

(function init(){
  const saved = localStorage.getItem("recetario:tema");
  const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0e1512" : "#eaf7ee";
  render();
})();
</script>
